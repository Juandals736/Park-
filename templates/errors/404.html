{% extends "base.html" %}

{% block title %}Página No Encontrada - Park+{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="width: 70px; height: 70px; background: var(--blue-50); color: var(--blue-600); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem;">
        <i class="fas fa-map-signs"></i>
    </div>
    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.5rem;">404 - Página No Encontrada</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1.5rem;">
        La ruta solicitada no existe o fue trasladada.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
        <i class="fas fa-home"></i> Volver al Inicio
    </a>
</div>
{% endblock %}
