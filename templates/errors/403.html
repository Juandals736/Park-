{% extends "base.html" %}

{% block title %}Acceso Denegado - Park+{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 3rem 2rem;">
    <div style="width: 70px; height: 70px; background: var(--red-50); color: var(--red-600); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.25rem;">
        <i class="fas fa-lock"></i>
    </div>
    <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.5rem;">403 - Acceso Denegado</h1>

    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">

    </a>

{% endblock %}
