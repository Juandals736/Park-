{% extends "base.html" %}

{% block title %}Cambiar Contraseña - Park+{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 2rem auto;">
    <div class="card">
        <div class="page-header" style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">
            <div>
                <h1 class="page-title"><i class="fas fa-key"></i> Cambiar Contraseña</h1>
                <p class="page-subtitle">Actualiza la clave de acceso de tu cuenta ({{ current_user.email }})</p>
            </div>
        </div>

        <form action="{{ url_for('auth.change_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="current_password">
                    <i class="fas fa-lock text-muted"></i> Contraseña Actual
                </label>
                <input type="password" name="current_password" id="current_password" class="form-control" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="new_password">
                    <i class="fas fa-shield-alt text-muted"></i> Nueva Contraseña
                </label>
                <input type="password" name="new_password" id="new_password" class="form-control" minlength="6" required>
                <small class="text-muted">Debe tener al menos 6 caracteres.</small>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirm_password">
                    <i class="fas fa-check-double text-muted"></i> Confirmar Nueva Contraseña
                </label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" minlength="6" required>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <a href="{{ url_for('index') }}" class="btn btn-outline">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-check"></i> Actualizar Contraseña
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
