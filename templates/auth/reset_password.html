{% extends "base.html" %}

{% block title %}Nueva Contraseña - Park+{% endblock %}

{% block extra_css %}
<style>
    html, body {
        height: 100vh !important;
        max-height: 100vh !important;
        overflow: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    .main-content {
        height: 100vh !important;
        padding: 0 !important;
        max-width: 100% !important;
        margin: 0 !important;
        overflow: hidden !important;
    }
    .flash-messages {
        position: absolute;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        max-width: 400px;
        width: 90%;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <!-- Botón flotante para regresar a la Landing -->
    <a href="{{ url_for('index') }}" class="btn-back-home" title="Volver al inicio">
        <i class="fas fa-arrow-left"></i> <span>Volver a Park+</span>
    </a>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge" style="background: linear-gradient(135deg, var(--green-600), var(--blue-600));">
                <i class="fas fa-unlock-alt"></i>
            </div>
            <h1 class="auth-title">Establecer Contraseña</h1>
            <p class="auth-subtitle">Ingresa la nueva clave para <strong>{{ email }}</strong></p>
        </div>

        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
            <div class="form-group" style="margin-bottom: 0.75rem;">
                <label class="form-label" for="password" style="font-size: 0.8rem; margin-bottom: 0.25rem;">
                    <i class="fas fa-lock text-muted"></i> Nueva Contraseña
                </label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" style="padding: 0.55rem 0.85rem; font-size: 0.88rem;" minlength="6" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 0.85rem;">
                <label class="form-label" for="confirm_password" style="font-size: 0.8rem; margin-bottom: 0.25rem;">
                    <i class="fas fa-check-double text-muted"></i> Confirmar Nueva Contraseña
                </label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repite la contraseña" style="padding: 0.55rem 0.85rem; font-size: 0.88rem;" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem; font-size: 0.92rem; font-weight: 700; border-radius: 10px;">
                <i class="fas fa-save"></i> Guardar Nueva Contraseña
            </button>
        </form>

        <div style="margin-top: 1rem; padding-top: 0.85rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.82rem;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--blue-600); font-weight: 600; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Volver al inicio de sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
